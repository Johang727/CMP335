<html>
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>List Builder</title>
        <meta name="description" content="">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <!--[if lt IE 7]>
            <p class="browsehappy">You are using an <strong>outdated</strong> browser. Please <a href="#">upgrade your browser</a> to improve your experience.</p>
        <![endif]-->
        <h1>Central Tendency Calculator</h1>
        <div class="myflexboxRow">
            <div class="myflexboxColumn">
                <h2>Enter Numbers To Calculate Central Tendencies</h2>

                <p style="margin-bottom: 0px;"><b>Enter a range:</b></p>
                <form name="myForm">
                    Start: <input type="number" name="range_lower" value=""><br />
                    End: <input type="number" name="range_upper" value=""><br />

                    <p style="margin-bottom: 0px;"><b>Enter a number to calculate:</b></p>

                    Number: <input type="number" name="num_to_add" value=""> <br><br>

                    <input type="button" value="Add" onclick="validateANDadd()">

                    <input type="button" value="Clear" onclick="clear_and_unlock()" style="background-color: darkred; color:white">
                </form>
            </div>
            <div class="myflexboxColumn">
                <h2>Numbers Computed</h2>
                <table id="num_list">
                </table>
                <br /> <br />
            </div>
            <div class="myflexboxColumn">
                <h2>Central Tendencies</h2>
                
                <p>Mean: <span id="mean_container"></span></p>
                <p>Median: <span id="median_container"></span></p>
                <p>Mode: <span id="mode_container"></span> </p>


                <br /> <br />

            </div>
        </div>    


        <script src="main.js" async defer></script>
    </body>
</html>
