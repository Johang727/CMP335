<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Student Directory</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar"><div class="container py-2">
      <a class="navbar-brand d-flex align-items-center gap-2" href="#"><span class="brand-mark"><i class="bi bi-mortarboard-fill"></i></span><span>Campus<span class="text-primary">Dir</span></span></a>
      <span class="navbar-text text-secondary d-none d-md-block">Student management</span>
    </div></nav>
    <main class="container py-4 py-lg-5">
      <div class="d-flex flex-column flex-md-row align-items-md-end justify-content-between gap-3 mb-4">
        <div><p class="eyebrow mb-2">Academic records</p><h1 class="page-title mb-1">Student directory</h1><p class="text-secondary mb-0">Create, review, update, and manage student records.</p></div>
        <button class="btn btn-primary px-4" type="button" data-bs-toggle="collapse" data-bs-target="#addStudent"><i class="bi bi-plus-lg me-2"></i>Add student</button>
      </div>
      <div class="collapse mb-4" id="addStudent"><div class="card form-card"><div class="card-body p-4">
        <div class="d-flex align-items-center mb-3"><h2 class="h5 mb-0">New student</h2><button class="btn-close ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#addStudent" aria-label="Close"></button></div>
        <form id="new-student-form" class="row g-3">
          <div class="col-md-4"><label class="form-label" for="lastname_new">Last name</label><input class="form-control" id="lastname_new" required autocomplete="family-name" /></div>
          <div class="col-md-4"><label class="form-label" for="firstname_new">First name</label><input class="form-control" id="firstname_new" required autocomplete="given-name" /></div>
          <div class="col-md-4"><label class="form-label" for="emailaddr_new">Email address</label><input class="form-control" id="emailaddr_new" type="email" required autocomplete="email" /></div>
          <div class="col-12 d-flex justify-content-end"><button class="btn btn-primary" type="submit"><i class="bi bi-person-plus me-2"></i>Create student</button></div>
        </form>
      </div></div></div>
      <div class="card directory-card">
        <div class="card-header directory-header"><div class="d-flex flex-column flex-lg-row align-items-lg-center justify-content-between gap-3">
          <div><h2 class="h5 mb-1">All students</h2><p class="text-secondary small mb-0" id="record-count">Loading records...</p></div>
          <div class="d-flex flex-column flex-sm-row gap-2">
            <div class="input-group student-search"><span class="input-group-text"><i class="bi bi-search"></i></span><input class="form-control" id="single-student" type="number" min="1" placeholder="Student ID" aria-label="Student ID" /><button class="btn btn-outline-primary" type="button" onclick="select_single()">Find</button></div>
            <button class="btn btn-light border" type="button" onclick="get_students()"><i class="bi bi-arrow-clockwise me-1"></i>Refresh</button>
          </div>
        </div></div>
        <div class="card-body p-0"><div id="students-list" class="table-responsive"><div class="empty-state"><div class="spinner-border text-primary" role="status"></div></div></div></div>
      </div>
    </main>
    <div class="toast-container position-fixed bottom-0 end-0 p-3"><div id="app-toast" class="toast align-items-center border-0" role="status" aria-live="polite"><div class="d-flex"><div class="toast-body" id="toast-message"></div><button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button></div></div></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="frontend.js"></script>
  </body>
</html>
